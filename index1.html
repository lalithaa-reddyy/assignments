<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Table</title>
    <style>
        body { text-align: center; }
        table { margin: 0 auto; border-collapse: collapse; width: 70%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        form { display: inline; }
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1; 
            left: 0; top: 0;
            width: 100%; height: 100%;
            overflow: auto; 
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 300px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Employee List</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Role</th><th>Salary</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for emp in employees %}
            <tr>
                <td>{{ emp.id }}</td>
                <td>{{ emp.name }}</td>
                <td>{{ emp.role }}</td>
                <td>{{ "{:,.2f}".format(emp.salary) }}</td>
                <td>
                    <button onclick="openUpdateModal({{ emp.id }}, '{{ emp.name|escape }}', '{{ emp.role|escape }}', {{ emp.salary }})">
                        Update
                    </button>
                    <form action="{{ url_for('delete_employee', emp_id=emp.id) }}" method="post" style="display:inline;">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h2>Add Employee</h2>
    <form action="{{ url_for('add_employee') }}" method="post">
        <input type="text" name="name" placeholder="Name" required>
        <select name="role" required>
            {% for role in roles %}
            <option value="{{ role }}">{{ role }}</option>
            {% endfor %}
        </select>
        <input type="number" name="salary" placeholder="Salary" required>
        <button type="submit">Add</button>
    </form>

    <div id="updateModal" class="modal">
        <div class="modal-content">
            <form id="updateForm" method="post">
                <input type="hidden" name="id" id="empId">
                <label>Name:</label><br>
                <input type="text" name="name" id="empName" required><br><br>
                <label>Role:</label><br>
                <select name="role" id="empRole" required>
                    {% for role in roles %}
                    <option value="{{ role }}">{{ role }}</option>
                    {% endfor %}
                </select><br><br>
                <label>Salary:</label><br>
                <input type="number" name="salary" id="empSalary" required><br><br>
                <button type="submit">Save</button>
                <button type="button" onclick="closeUpdateModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        function openUpdateModal(id, name, role, salary) {
            document.getElementById("updateModal").style.display = "block";
            document.getElementById("empId").value = id;
            document.getElementById("empName").value = name;
            document.getElementById("empRole").value = role;
            document.getElementById("empSalary").value = salary;
            document.getElementById("updateForm").action = `/update/${id}`;
        }
        function closeUpdateModal() {
            document.getElementById("updateModal").style.display = "none";
        }
    </script>
</body>
</html>
