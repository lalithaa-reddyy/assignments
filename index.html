<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #f4f4f4; }
        input[readonly] { background-color: #eee; border: none; }
        button { margin: 2px; padding: 5px 10px; }
        select { padding: 5px; }
    </style>
</head>
<body>

    <h1>Employee Manager</h1>

    <!-- Add Employee -->
    <h3>Add Employee</h3>
    <form action="/employees" method="post">
        <input type="hidden" name="action" value="add">
        <input type="text" name="name" placeholder="Name" required>

        <select name="role" required>
            <option value="">-- Select Role --</option>
            <option value="Manager">Manager</option>
            <option value="Developer">Developer</option>
            <option value="Designer">Designer</option>
            <option value="HR">HR</option>
        </select>

        <input type="number" name="salary" placeholder="Salary" required>
        <button type="submit">Add</button>
    </form>


    <!-- Employee Table -->
    <h3>Employees</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Role</th><th>Salary</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for emp in employees %}
            <tr>
                <form action="/employees" method="post">
                    <td>{{ emp.id }}</td>

                    <!-- Editable Name -->
                    <td>
                        <input type="text" name="name" value="{{ emp.name }}" readonly>
                    </td>

                    <!-- Editable Role (converted to select on edit) -->
                    <td>
                        <select name="role" disabled>
                            <option value="Manager" {% if emp.role = 'Manager' %}selected{% endif %}>Manager</option>
                            <option value="Developer" {% if emp.role = 'Developer' %}selected{% endif %}>Developer</option>
                            <option value="Designer" {% if emp.role = 'Designer' %}selected{% endif %}>Designer</option>
                            <option value="HR" {% if emp.role = 'HR' %}selected{% endif %}>HR</option>
                        </select>
                    </td>

                    <!-- Editable Salary -->
                    <td>
                        <input type="number" name="salary" value="{{ emp.salary }}" readonly>
                    </td>

                    <td>
                        <input type="hidden" name="id" value="{{ emp.id }}">
                        <input type="hidden" name="action" value="update">

                        <button type="button" data-editing="0" onclick="toggleEdit(this)">Edit</button>
                        <button type="submit">Update</button>
                    </td>
                </form>

                <form action="/employees" method="post" style="display:inline;">
                    <td colspan="5">
                        <input type="hidden" name="id" value="{{ emp.id }}">
                        <input type="hidden" name="action" value="delete">
                        <button type="submit">Delete</button>
                    </td>
                </form>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        function toggleEdit(btn) {
            var form = btn.form;

            var name = form.querySelector('input[name="name"]');
            var role = form.querySelector('select[name="role"]');
            var salary = form.querySelector('input[name="salary"]');

            var editing = btn.dataset.editing === "1";

            if (editing) {
                // Save mode → back to read-only
                name.setAttribute("readonly", "");
                salary.setAttribute("readonly", "");
                role.setAttribute("disabled", "");
                btn.textContent = "Edit";
                btn.dataset.editing = "0";

                // Submit when done saving
                form.submit();
            } else {
                // Edit mode → unlock fields
                name.removeAttribute("readonly");
                salary.removeAttribute("readonly");
                role.removeAttribute("disabled");
                btn.textContent = "Save";
                btn.dataset.editing = "1";
                name.focus();
            }
        }
    </script>

</body>
</html>
