<!DOCTYPE html>
<html>
<head>
    <title>Manage Roles</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 50%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f2f2f2; }
        input[type="text"] { padding: 8px; width: 200px; }
        button { padding: 8px 12px; cursor: pointer; }
        .delete-btn { background-color: #c0392b; color: white; border: none; }
        .add-btn { background-color: #2ecc71; color: white; border: none; }
        a { text-decoration: none; display: inline-block; margin-bottom: 20px; color: #2980b9; }
    </style>
</head>

<body>

    <h1>Role Management</h1>

    <a href="/">← Back to Employees</a>

    <h3>Add New Role</h3>
    <form action="/roles/add" method="POST">
        <input type="text" name="name" placeholder="Role name" required>
        <button class="add-btn" type="submit">Add Role</button>
    </form>

    <h3>Existing Roles</h3>
    <table>
        <tr>
            <th>ID</th>
            <th>Role Name</th>
            <th>Action</th>
        </tr>

        {% for role in roles %}
        <tr>
            <td>{{ role["id"] }}</td>
            <td>{{ role["name"] }}</td>
            <td>
                <form action="/roles/delete/{{ role['id'] }}" method="POST"
                      onsubmit="return confirm('Delete this role?');">
                    <button class="delete-btn" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
